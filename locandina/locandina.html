<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Locandina Baila Bonita</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800;125,900&family=Shrikhand&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --coral: #ff5757; --pink: #ff8fa3; --blush: #ffe3e7; --ink: #2a1418; }
  html, body { background: var(--blush); }
  .poster {
    position: relative; overflow: hidden; width: 1080px; height: 1350px;
    background: var(--coral); color: #fff;
    font-family: "Archivo", sans-serif; font-stretch: 125%;
    display: flex; flex-direction: column; align-items: center;
  }
  .story { height: 1920px; }
  .main { flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 50px 0; }
  .logo { width: 900px; display: block; filter: drop-shadow(0 22px 30px rgba(120,10,30,.35)); }
  .day { color: var(--blush); font-weight: 800; font-size: 46px; letter-spacing: 14px; margin-top: 10px; padding-left: 14px; }
  .date { font-weight: 900; font-size: 124px; line-height: .95; letter-spacing: -3px; white-space: nowrap; text-shadow: 6px 6px 0 #c9303f; }
  .band {
    width: 100%; background: var(--blush); color: var(--coral);
    display: flex; align-items: center; justify-content: space-between; gap: 40px;
    padding: 46px 70px 54px;
  }
  .dj small { display: block; font-weight: 800; font-size: 30px; letter-spacing: 8px; color: var(--ink); }
  .dj b { display: block; font-weight: 900; font-size: 74px; line-height: 1; letter-spacing: -1px; margin-top: 8px; }
  .venue { text-align: right; }
  .venue img { height: 120px; display: block; margin-left: auto; }
  .venue span { display: block; font-weight: 800; font-size: 24px; letter-spacing: 3px; margin-top: 10px; color: var(--ink); white-space: nowrap; }
  .story .main { padding-top: 140px; gap: 10px; }
  .story .logo { width: 960px; }
  .story .day { font-size: 54px; margin-top: 40px; }
  .story .date { font-size: 124px; }
  .story .band { flex-direction: column; text-align: center; gap: 44px; padding: 80px 70px 230px; }
  .story .venue { text-align: center; }
  .story .venue img { margin: 0 auto; height: 150px; }
  .story .dj b { font-size: 92px; }
</style>
</head>
<body>
<div class="poster" id="poster">
  <div class="main">
    <img class="logo" src="../logo.png" alt="Baila Bonita">
    <div class="day">VENERDÌ</div>
    <div class="date">4 DICEMBRE</div>
  </div>
  <div class="band">
    <div class="dj"><small>DJ SET</small><b>RED MASTER</b></div>
    <div class="venue"><img src="flora-logo-dark.png" alt="Flora Saffi"><span>PIAZZA SAFFI · FORLÌ</span></div>
  </div>
</div>
<script>if (location.hash === '#story') document.getElementById('poster').classList.add('story');</script>
</body>
</html>
