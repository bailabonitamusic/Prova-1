<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Locandina Baila Bonita</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Unbounded:wght@900&family=Shrikhand&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  .poster {
    --h: 1350px;
    position: relative; overflow: hidden; width: 1080px; height: var(--h);
    background:
      radial-gradient(ellipse 60% 35% at 50% 62%, rgba(214,60,255,.55), transparent 70%),
      radial-gradient(circle at 0% 75%, rgba(150,40,255,.55), transparent 35%),
      radial-gradient(circle at 100% 70%, rgba(255,40,200,.45), transparent 35%),
      radial-gradient(circle at 50% 110%, rgba(120,20,200,.7), transparent 50%),
      linear-gradient(180deg, #050208 0%, #12041d 55%, #1d0630 100%);
    color: #fff; font-family: "Archivo", sans-serif; font-stretch: 125%;
  }
  .story { --h: 1920px; }
  .grain { position: absolute; inset: 0; opacity: .18; mix-blend-mode: overlay; }
  /* neon arch, like the stage lights */
  .arch { position: absolute; left: 50%; transform: translateX(-50%); width: 900px; height: 900px; border-radius: 50%;
    border: 6px solid rgba(225,120,255,.55); top: 380px;
    box-shadow: 0 0 30px rgba(200,80,255,.8), inset 0 0 30px rgba(200,80,255,.6); filter: blur(1px);
    -webkit-mask: linear-gradient(#000 55%, transparent 80%); mask: linear-gradient(#000 55%, transparent 80%); }
  .story .arch { top: 640px; }
  .lip { position: absolute; filter: drop-shadow(0 0 14px rgba(255,120,220,.9)) drop-shadow(0 0 30px rgba(255,80,200,.5)); }
  .flora { position: absolute; left: 50%; transform: translateX(-50%); top: 70px; width: 420px;
    filter: drop-shadow(0 0 10px rgba(255,150,230,.9)) drop-shadow(0 0 24px rgba(220,80,255,.6)); }
  .story .flora { top: 200px; width: 470px; }
  svg.title { position: absolute; left: 0; width: 1080px; top: 290px; overflow: visible; }
  .story svg.title { top: 520px; }
  .info { position: absolute; left: 0; right: 0; padding: 0 44px; text-align: center; top: 905px;
    text-shadow: 0 0 6px #fff, 0 0 18px rgba(255,110,220,.95), 0 0 40px rgba(220,60,255,.8); }
  .story .info { top: 1190px; }
  .info .date { font-size: 64px; line-height: 1; letter-spacing: -1px; white-space: nowrap; }
  .info .dj { display: flex; align-items: center; justify-content: center; gap: 30px; margin-top: 22px; }
  .info .dj span { font-size: 50px; line-height: 1; white-space: nowrap; }
  .info .dj img { height: 120px; filter: drop-shadow(0 0 8px rgba(255,60,60,.9)) drop-shadow(0 0 22px rgba(255,40,40,.6)); }
  .story .info .dj { flex-direction: column; gap: 20px; margin-top: 40px; }
  .story .info .dj img { height: 170px; }
  .foot { position: absolute; left: 70px; right: 60px; bottom: 50px; display: flex; align-items: flex-end; justify-content: space-between; }
  .story .foot { bottom: 210px; }
  .venue b { display: block; font-size: 46px; letter-spacing: 1px; line-height: 1; text-shadow: 0 0 6px #fff, 0 0 16px rgba(255,110,220,.9); }
  .venue small { display: block; font-family: "Oswald"; font-weight: 500; font-stretch: 100%; font-size: 26px; letter-spacing: 1px; margin-top: 10px; }
  .bb { width: 190px; transform: rotate(-6deg); filter: drop-shadow(0 0 12px rgba(255,120,200,.6)); }
</style>
</head>
<body>
<div class="poster" id="poster">
  <svg class="grain" width="100%" height="100%"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  <div class="arch"></div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <linearGradient id="lipg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffc2ea"/><stop offset=".55" stop-color="#ff7fcf"/><stop offset="1" stop-color="#e94bb0"/>
      </linearGradient>
      <symbol id="lips" viewBox="0 0 200 115">
        <path fill="url(#lipg)" stroke="#fff" stroke-width="3" d="M8,56 C38,20 68,4 90,22 C95,27 105,27 110,22 C132,4 162,20 192,56 C150,50 130,58 100,60 C70,58 50,50 8,56 Z"/>
        <path fill="url(#lipg)" stroke="#fff" stroke-width="3" d="M8,58 C50,64 70,68 100,68 C130,68 150,64 192,58 C166,98 132,111 100,111 C68,111 34,98 8,58 Z"/>
        <path fill="#3a0a2c" d="M16,57 C50,52 72,60 100,62 C128,60 150,52 184,57 C150,62 128,66 100,66 C72,66 50,62 16,57 Z"/>
        <ellipse cx="62" cy="30" rx="16" ry="5" fill="#fff" opacity=".85" transform="rotate(-25 62 30)"/>
        <ellipse cx="140" cy="30" rx="12" ry="4" fill="#fff" opacity=".7" transform="rotate(22 140 30)"/>
        <ellipse cx="96" cy="88" rx="30" ry="6" fill="#fff" opacity=".75"/>
      </symbol>
      <filter id="puff" x="-10%" y="-20%" width="120%" height="150%">
        <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="4" seed="4" result="n"/>
        <feMorphology in="SourceGraphic" operator="dilate" radius="1.5" result="fat"/>
        <feGaussianBlur in="fat" stdDeviation="2.5" result="soft"/>
        <feComponentTransfer in="soft" result="round"><feFuncA type="linear" slope="4" intercept="-1.4"/></feComponentTransfer>
        <feDisplacementMap in="round" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" result="fuzz"/>
        <feGaussianBlur in="fuzz" stdDeviation="8" result="blur"/>
        <feComposite in="blur" in2="n" operator="arithmetic" k2="1" k3=".22" result="height"/>
        <feDiffuseLighting in="height" surfaceScale="10" diffuseConstant="1.15" lighting-color="#fff" result="light">
          <feDistantLight azimuth="225" elevation="48"/>
        </feDiffuseLighting>
        <feComposite in="light" in2="fuzz" operator="arithmetic" k1="1" k3=".22" result="lit"/>
        <feComposite in="lit" in2="fuzz" operator="in" result="body"/>
        <feMorphology in="fuzz" operator="dilate" radius="1" result="d"/>
        <feOffset in="d" dx="0" dy="10" result="ex"/>
        <feFlood flood-color="#b0207e"/><feComposite in2="ex" operator="in" result="extr"/>
        <feGaussianBlur in="fuzz" stdDeviation="22" result="gl"/>
        <feFlood flood-color="#ff7ad9" flood-opacity=".75"/><feComposite in2="gl" operator="in" result="glow"/>
        <feMerge><feMergeNode in="glow"/><feMergeNode in="extr"/><feMergeNode in="body"/></feMerge>
      </filter>
    </defs>
  </svg>

  <img class="flora" src="flora-logo-white.png" alt="Flora Saffi">

  <svg class="title" viewBox="0 0 1080 640" height="640">
    <g filter="url(#puff)" fill="#ff9fd8" text-anchor="middle">
      <text x="540" y="190" font-family="Unbounded" font-weight="900" font-size="178" letter-spacing="-6">BAILA</text>
      <text x="540" y="375" font-family="Unbounded" font-weight="900" font-size="178" letter-spacing="-6">BONITA</text>
      <text x="560" y="530" font-family="Shrikhand" font-size="170" letter-spacing="6" transform="rotate(-4 560 490)">Music</text>
    </g>
  </svg>

  <div id="lipsLayer"></div>

  <div class="info">
    <div class="date">VENERDÌ 4 DICEMBRE</div>
    <div class="dj"><span>DJ SET</span><img src="red-master.png" alt="Red Master"></div>
  </div>

  <div class="foot">
    <div class="venue"><b>FLORA SAFFI</b><small>PIAZZA SAFFI · FORLÌ (FC)</small></div>
    <img class="bb" src="../logo.png" alt="Baila Bonita">
  </div>
</div>
<script>
  const story = location.hash === '#story';
  if (story) document.getElementById('poster').classList.add('story');
  // [left, top, width, rotation]
  const post = [[740,50,150,14],[60,190,170,-14],[960,300,110,18],[-45,560,150,-20],[975,720,120,12],[-30,1000,110,-15],[970,1080,150,10],[560,1285,130,8]];
  const st   = [[740,120,160,14],[50,330,180,-14],[880,430,110,10],[-45,960,150,-20],[965,1040,130,15],[-35,1420,120,-12],[960,1430,140,10],[560,1780,130,8],[160,1820,100,-10]];
  const layer = document.getElementById('lipsLayer');
  for (const [l,t,w,r] of (story ? st : post)) {
    layer.insertAdjacentHTML('beforeend', `<svg class="lip" style="left:${l}px;top:${t}px;width:${w}px;transform:rotate(${r}deg)" viewBox="0 0 200 115"><use href="#lips"/></svg>`);
  }
</script>
</body>
</html>
